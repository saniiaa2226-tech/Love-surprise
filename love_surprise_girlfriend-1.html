<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Warning ♡</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
  overflow:hidden;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffe5f0,#eee4ff);
}
.card{
  width:min(88%,360px);padding:34px 24px;text-align:center;
  background:rgba(255,255,255,.96);border-radius:28px;
  box-shadow:0 18px 45px rgba(90,40,80,.15);position:relative;z-index:2;
}
.cute{font-size:30px;color:#d96b9b;margin-bottom:8px;animation:float 2s ease-in-out infinite}
h1{margin:8px 0 14px;font-size:25px;color:#d45b8e}
p{color:#666;font-size:17px;line-height:1.5}
button{
  margin-top:12px;border:0;padding:14px 28px;border-radius:999px;
  background:#f58bb3;color:white;font-size:17px;font-weight:bold;cursor:pointer;
  box-shadow:0 7px 18px rgba(245,139,179,.3);
}
button:active{transform:scale(.94)}
#reveal{display:none;margin-top:24px;animation:pop .6s ease}
.love{font-size:24px;font-weight:bold;color:#d45b8e;line-height:1.5}
.tiny{font-size:17px;color:#777;margin-top:8px;line-height:1.45}
.heart{
  position:fixed;bottom:-30px;pointer-events:none;
  animation:floatUp 4s linear forwards;z-index:1;color:#e88db1;
}
@keyframes floatUp{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div class="card">
  <div class="cute">୨୧ ૮ ˶ᵔ ᵕ ᵔ˶ ა ୨୧</div>
  <h1>WARNING</h1>
  <p>Someone is illegally occupying<br>too much space in my heart.</p>
  <button onclick="revealLove()">REVEAL ♡</button>

  <div id="reveal">
    <div class="love">Yep. It's you. ♡</div>
    <div class="love">I LOVE YOU</div>
    <div class="tiny">Congrats, girlfriend.<br>You’re stuck with my love now. ♡</div>
  </div>
</div>

<script>
function revealLove(){
  document.getElementById("reveal").style.display="block";
  for(let i=0;i<18;i++){
    setTimeout(()=>{
      const heart=document.createElement("div");
      heart.className="heart";
      heart.textContent=["♡","♥","୨୧"][Math.floor(Math.random()*3)];
      heart.style.left=Math.random()*100+"vw";
      heart.style.fontSize=(18+Math.random()*18)+"px";
      heart.style.animationDuration=(3+Math.random()*2)+"s";
      document.body.appendChild(heart);
      setTimeout(()=>heart.remove(),5000);
    },i*80);
  }
}
</script>
</body>
</html>
